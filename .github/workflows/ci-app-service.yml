# ==============================================================================
# Payment Service - CI Pipeline
# ==============================================================================
# Build, test, and optionally push Docker image to ACR
# ==============================================================================

name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "PaymentService/**"
      - "Dockerfile"
      - ".github/workflows/ci.yml"

  pull_request:
    branches: [main]
    paths:
      - "PaymentService/**"
      - "Dockerfile"

  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0"
  SERVICE_NAME: payment-service
  # ACR_NAME: xshopai
  # ACR_LOGIN_SERVER: xshopai.azurecr.io

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore PaymentService/PaymentService.csproj

      - name: Build
        run: dotnet build PaymentService/PaymentService.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test PaymentService/PaymentService.csproj --configuration Release --no-build --verbosity normal
        continue-on-error: true

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          tags: |
            ${{ env.SERVICE_NAME }}:${{ github.sha }}
            ${{ env.SERVICE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ==================================================================
