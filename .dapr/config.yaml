apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: payment-service-config
spec:
  features:
    - name: SchedulerReminders
      enabled: false
  scheduler:
    enabled: false
  tracing:
    samplingRate: '1'
    zipkin:
      endpointAddress: 'http://localhost:9411/api/v2/spans'
  metric:
    enabled: true
